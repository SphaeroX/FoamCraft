# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "foamcraft-geometry"
description = "Geometry of FoamCraft: mesh readers, diagnosis, transformations."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "readers"
path = "../../tests/geometry/readers.rs"

[[test]]
name = "diagnosis"
path = "../../tests/geometry/diagnosis.rs"

[[test]]
name = "transform"
path = "../../tests/geometry/transform.rs"

[[test]]
name = "performance"
path = "../../tests/geometry/performance.rs"

[dependencies]
foamcraft-core = { version = "0.1.0", path = "../foamcraft-core" }
glam = "0.34.3"
quick-xml = "0.42.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[[test]]
name = "geometry_commands"
path = "../../tests/geometry/commands.rs"

[[test]]
name = "segment"
path = "../../tests/geometry/segment.rs"

[[test]]
name = "surfaces"
path = "../../tests/geometry/surfaces.rs"

[[test]]
name = "cad"
path = "../../tests/geometry/cad.rs"

[[test]]
name = "openings"
path = "../../tests/geometry/openings.rs"

[[test]]
name = "caps"
path = "../../tests/geometry/caps.rs"
