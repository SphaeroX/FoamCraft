# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "foamcraft-sim"
description = "Simulation setup of FoamCraft: scenarios, media, wind tunnel rules, case generation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "mesh_progress"
path = "../../tests/sim/mesh_progress.rs"

[[test]]
name = "frontal_area"
path = "../../tests/sim/frontal_area.rs"

[[test]]
name = "wind_tunnel"
path = "../../tests/sim/wind_tunnel.rs"

[dependencies]
foamcraft-core = { version = "0.1.0", path = "../foamcraft-core" }
foamcraft-geometry = { version = "0.1.0", path = "../foamcraft-geometry" }
glam = "0.34.3"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[dev-dependencies]
glam = "0.34.3"
serde_json = "1.0.154"

[[test]]
name = "distance"
path = "../../tests/sim/distance.rs"

[[test]]
name = "ride"
path = "../../tests/sim/ride.rs"

