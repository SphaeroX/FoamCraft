# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "foamcraft-report"
description = "Reports of FoamCraft runs: model, PDF (Typst) and self-contained HTML."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"

[dev-dependencies]
png = "0.18.1"

[[test]]
name = "report"
path = "../../tests/report/report.rs"
