# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "foamcraft-mcp"
description = "MCP server of FoamCraft: curated tools on the command API, over stdio."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
foamcraft-core.workspace = true
foamcraft-api.workspace = true
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde_json = "1.0.154"
base64 = "0.22"

[dev-dependencies]
foamcraft-runtime.workspace = true
rmcp = { version = "3.11.0", default-features = false, features = ["server", "client", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[[test]]
name = "mcp_tools"
path = "../../tests/mcp/tools.rs"

[[test]]
name = "mcp_protocol"
path = "../../tests/mcp/protocol.rs"
