#
# Publishes the landing page (site/) on GitHub Pages together with the README pictures, the
# display font and the app icon (tools/site/assemble.sh). Runs when the page changes and after
# the Screenshots workflow, whose picture commit does not start other workflows by itself.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Screenshots]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble the site
        run: bash tools/site/assemble.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
